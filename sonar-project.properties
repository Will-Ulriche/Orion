# Configuration SonarCloud pour Orion
sonar.projectKey=Will-Ulriche_Orion
sonar.organization=will-ulriche

# Repertoires de sources et de tests
sonar.sources=src,src-tauri/src
sonar.tests=src,supabase/tests,supabase/functions

# Fichiers a considerer comme tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.mjs,**/*_test.mjs,supabase/tests/**

# Exclusions strictes de la duplication de code (CPD)
# Empeche SonarCloud de compter la duplication sur les tests, mocks et migrations
sonar.cpd.exclusions=**/*.test.*,**/*_test.*,src-tauri/migrations/**,supabase/migrations/**,supabase/tests/**

# Exclusions generales des builds et dependances
sonar.exclusions=node_modules/**,dist/**,src-tauri/target/**

